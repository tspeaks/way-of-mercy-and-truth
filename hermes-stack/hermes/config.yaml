# Hermes Agent — points at the local LiteLLM proxy and nothing else.
#
# Deploy to ~/.hermes/config.yaml (scripts/bootstrap.sh does this, backing up
# any existing file first). Secrets come from ~/.hermes/.env via ${VAR}.
#
# Verify after deploying:  hermes config get model     (see docs/MIGRATION.md)
#
# Schema note: Hermes' current docs use the `providers:` dictionary. The older
# `custom_providers:` list still loads and auto-migrates, but write new config
# in this form.

providers:
  litellm:
    api: http://127.0.0.1:4000/v1
    name: "LiteLLM (local)"
    api_key: "${LITELLM_MASTER_KEY}"
    transport: chat_completions
    # EMERGENCY STOPGAP (2026-09-01, see docs/KNOWN-ISSUES.md -> "smart-router
    # doesn't forward tools"): auto_router/complexity_router silently drops the
    # tools array before it reaches whatever deployment it picks, confirmed via
    # curl with smart-router vs. mistral-tools directly on the same prompt.
    # Pointed straight at mistral-tools until that's fixed upstream or a newer
    # LiteLLM version resolves it. This sacrifices tiered/free-quota routing --
    # every request pays MEDIUM-tier cost regardless of actual complexity.
    # Revert both lines below to smart-router the moment tools work through it
    # again; do not leave this in place longer than necessary.
    default_model: mistral-tools
    # Hermes probes /v1/models; the router advertises every deployment, and you
    # do not want Hermes picking one directly. Pin the list instead.
    discover_models: false
    models:
      smart-router:
        # The router spans a 5K deployment and a 1M one. Declare the context you
        # want Hermes to PLAN against -- the 131K that the COMPLEX tier serves.
        # LiteLLM's context_window_fallbacks catch anything that overflows a
        # smaller deployment underneath, so Hermes never has to know.
        context_length: 131072
      nvidia-kimi:
        context_length: 1000000
      codestral:
        context_length: 128000
      mistral-tools:
        context_length: 128000
      local-coder:
        context_length: 28672
      offtopic:
        context_length: 131072
      gemini-flash:
        context_length: 1048576

model:
  provider: litellm
  # See the EMERGENCY STOPGAP note above providers.litellm.default_model --
  # both must point at the same deployment while smart-router's tools bug
  # is unresolved.
  default: mistral-tools
  api_mode: chat_completions

# Real command execution. Without this block, Hermes has no working terminal
# tool at all -- it will describe commands in prose instead of running them,
# which is what "no file system access" actually was. backend: local runs
# directly on this machine (no Docker/SSH/cloud sandbox), since Hermes and
# the thing it's editing are already on the same box. cwd matters for the
# gateway/cron context (Telegram); an interactive CLI session always uses
# whatever directory you launched `hermes` from instead.
terminal:
  backend: local
  cwd: "${HOME}"
  timeout: 180

# Structured, typed file read/write as a second path alongside raw shell --
# some operations are cleaner as read_file/write_file/list_directory than as
# a bash one-liner. Scoped to the whole home directory per Tyler's request;
# narrow this to specific project directories later if the blast radius of
# "every file Hermes can touch" ever needs tightening.
mcp_servers:
  filesystem:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "${HOME}"]

# No fallback_providers here on purpose: LiteLLM owns failover. Two independent
# fallback layers fighting each other is how you end up burning the last-resort
# quota without noticing.
fallback_providers: []

auxiliary:
  # Side tasks run on a named tier directly -- there is no reason to pay the
  # router's classification pass to decide that a title needs a small model.
  #
  # The genuinely inconsequential slots go to Aion Labs, whose 20K tokens/DAY
  # would be a rounding error against coding work but is ample for titles and
  # metadata. That is the whole reason it is in the stack.
  title_generation:
    enabled: true
    provider: litellm
    model: offtopic
    timeout: 30
  tts_audio_tags:
    provider: litellm
    model: offtopic
    timeout: 30
  skills_hub:
    provider: litellm
    model: offtopic
    timeout: 30
  mcp:
    provider: litellm
    model: offtopic
    timeout: 30

  # Compression reads the whole context, so it needs a big window and cannot go
  # to the local 28K model or to Aion's daily budget.
  compression:
    provider: litellm
    model: nvidia-kimi
    timeout: 120
    max_concurrency: 2
  triage_specifier:
    provider: litellm
    model: nvidia-kimi
    timeout: 120
  vision:
    # Only Gemini in this stack takes images.
    provider: litellm
    model: gemini-flash
    timeout: 120

delegation:
  # Subagents get a fast, large-context tier; the parent keeps the router and
  # synthesises. Deliberately NOT the local model: ollama is configured with
  # OLLAMA_NUM_PARALLEL=1 so the 8 GB card holds one context, and concurrent
  # subagents would serialise behind each other.
  provider: litellm
  model: nvidia-kimi
  api_mode: chat_completions

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20
  protect_first_n: 3
  # Pinned explicitly, not just left at the default -- 2026-09-01 investigated
  # a compaction-prompt leak that happened at 13% context, well under the 50%
  # threshold: above. idle_compact_after_seconds defaults to 0 (disabled) and
  # was never set, so it was never the cause; pinning it here so that fact
  # doesn't have to be rediscovered next time. See docs/KNOWN-ISSUES.md.
  idle_compact_after_seconds: 0
  # No-LLM algorithmic prune of stale tool results before a full LLM-driven
  # compaction pass is ever needed -- free relative to the threshold-triggered
  # compaction above, which pays nvidia-kimi. Starting value; tune once you
  # have a feel for how fast real sessions accumulate tool output.
  proactive_prune_tokens: 20000
  # Absolute floor, on top of the 50% relative threshold. Protects local-coder
  # specifically -- 50% of its 28672-token window is ~14K, but the percentage
  # is calculated against whichever model Hermes THINKS it's talking to
  # (currently mistral-tools' 128K while the router stopgap is in place). Once
  # smart-router is restored and a turn can land on local-coder, this is the
  # backstop that keeps compaction from being skipped past that tier's real,
  # much smaller ceiling.
  threshold_tokens: 20000

tool_output:
  # Free tiers make every wasted token expensive. Trim tool output hard before
  # reaching for a compression plugin.
  max_bytes: 30000
  max_lines: 1200
  max_line_length: 2000

# Scan any skill Hermes writes for itself before it can be used. Off by
# default upstream; on here because Hermes has real, unsandboxed terminal
# access on this machine (terminal.backend: local) -- a self-created skill is
# code that will run with that same access.
skills:
  guard_agent_created: true

agent:
  api_max_retries: 2   # LiteLLM already retries once; do not stack deep retries
  # Off by default upstream. On here after 2026-09-01: task 4's "36 renames
  # done, syntax valid" was confident, detailed, and entirely narrated -- no
  # file had actually changed, caught only because Tyler ran `git diff`
  # himself. This makes Hermes run that same kind of check after every stop
  # instead of relying on someone catching it by hand.
  verify_on_stop: true

# Config schema version 10 ships new fields on every release (this stack has
# been on a ~2-week release cadence lately -- see docs/V0.21-OPPORTUNITIES.md).
# `quick` (the default) is fast but a `full` backup is worth the extra seconds
# given how much has changed release to release.
updates:
  pre_update_backup: full
