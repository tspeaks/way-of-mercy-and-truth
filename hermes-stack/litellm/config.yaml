# LiteLLM Proxy — Hermes routing tier
#
# Portable: nothing machine-specific lives in this file. All secrets and the two
# account-scoped URLs come from the environment (see .env.example).
#
# Validate offline before starting:   scripts/validate-config.py
# Probe live endpoints + model ids:   scripts/preflight.sh
# Refresh the OpenRouter free block:  scripts/refresh-openrouter-free.py
#
# Every model entry carries BOTH:
#   max_input_tokens  -> used by enable_pre_call_checks to skip deployments whose
#                        context window is too small for the current prompt
#   max_tokens        -> max OUTPUT tokens (this is NOT the context window)
# Getting this wrong is the single most common cause of mid-session 400s.
#
# Where a provider's binding constraint is tokens-per-minute rather than context
# (Groq), max_input_tokens is set to the TPM ceiling instead of the model's real
# context. That turns a rate limit into a routing rule: long prompts are never
# offered to it in the first place.

include:
  - openrouter-free.yaml   # generated; see scripts/refresh-openrouter-free.py

model_list:

  # ── LOCAL — RTX 2070, 8 GB, VRAM-resident only ───────────────────────────────
  # Weights + KV cache must fit in VRAM with room for the desktop. Nothing here
  # may spill to system RAM. scripts/local-guard.sh enforces that and exits
  # non-zero if Ollama reports any CPU placement.
  #   qwen2.5-coder:7b-instruct-q4_K_M  ~4.7 GB weights
  #   32K context, q8_0 KV cache        ~0.9 GB
  #   compute buffers                   ~0.6 GB
  #                                     ~6.2 GB of 8 GB
  - model_name: local-coder
    litellm_params:
      model: openai/hermes-local   # created by scripts/setup-local-model.sh
      api_base: os.environ/LOCAL_API_BASE
      api_key: os.environ/LOCAL_API_KEY
      rpm: 600
      tpm: 10000000
    model_info:
      max_input_tokens: 28672     # 32K served, minus headroom for the reply
      max_tokens: 4096
      supports_vision: false

  # ── GROQ — 30 RPM / 6K TPM / 14.4K RPD, org-wide (extra keys do not help) ────
  # The 6K TPM cap is the real constraint: one 6K-token request per minute. Kept
  # for short, high-frequency turns, and fenced off from long prompts by
  # max_input_tokens rather than by hoping the classifier keeps them away.
  # Model id verified live 2026-09-01 -- Groq retired llama-3.3-70b-versatile;
  # gpt-oss-20b is the closest fit for a fast, short-prompt tier. Re-check with
  # scripts/preflight.sh periodically, this lineup rotates.
  - model_name: groq-fast
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      rpm: 25
      tpm: 5500
    model_info:
      max_input_tokens: 5000      # deliberately the TPM ceiling, not the context window
      max_tokens: 2048
      supports_vision: false

  # ── MISTRAL / CODESTRAL — best free coding allowance (~1B tokens/month) ──────
  # PRIVACY: the free Experiment tier trains on your prompts unless you opt out
  # at console.mistral.ai -> Admin -> Privacy. Do that before the first request.
  # RATE: Mistral no longer publishes free-tier RPM. rpm below is deliberately
  # conservative; raise it to whatever your Admin Console -> Limits shows.
  # NOT tool-capable: confirmed live 2026-09-01 that codestral-latest returns
  # tool_calls: null and writes the call as plain text instead. Demoted from
  # MEDIUM/default to a fallback -- still useful for pure code generation,
  # just not for anything Hermes needs to actually execute.
  - model_name: codestral
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 6
      tpm: 300000
    model_info:
      max_input_tokens: 128000
      max_tokens: 8192
      supports_vision: false

  # ── MISTRAL SMALL — the MEDIUM tier and default_model ────────────────────────
  # Same account/key/quota as codestral above; mistral-small-latest is a
  # general instruct model with real function-calling support, unlike
  # codestral. This is the one Hermes actually needs for everyday tool use.
  - model_name: mistral-tools
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 6
      tpm: 300000
    model_info:
      max_input_tokens: 128000
      max_tokens: 8192
      supports_vision: false

  # ── SAMBANOVA — DISABLED. Not actually free: confirmed live 2026-09-01 that
  # the account rejects requests with "A payment method is required." Left
  # commented rather than deleted in case that changes.
  #
  # - model_name: sambanova-deepseek
  #   litellm_params:
  #     model: sambanova/DeepSeek-V3.1
  #     api_key: os.environ/SAMBANOVA_API_KEY
  #     rpm: 15
  #     tpm: 100000
  #   model_info:
  #     max_input_tokens: 32768
  #     max_tokens: 8192
  #     supports_vision: false

  # ── QWEN / DashScope — DISABLED. No free tier for qwen3-coder-plus or
  # qwen3-coder-flash (confirmed in the Model Studio console). Left commented
  # rather than deleted in case a genuinely free Qwen model appears later.
  #
  # - model_name: qwen3-coder
  #   litellm_params:
  #     model: openai/qwen3-coder-plus
  #     api_base: os.environ/DASHSCOPE_API_BASE
  #     api_key: os.environ/DASHSCOPE_API_KEY
  #     rpm: 120
  #     tpm: 1000000
  #   model_info:
  #     max_input_tokens: 131072
  #     max_tokens: 8192
  #     supports_vision: false
  #
  # - model_name: qwen3-flash
  #   litellm_params:
  #     model: openai/qwen3-coder-flash
  #     api_base: os.environ/DASHSCOPE_API_BASE
  #     api_key: os.environ/DASHSCOPE_API_KEY
  #     rpm: 120
  #     tpm: 1000000
  #   model_info:
  #     max_input_tokens: 131072
  #     max_tokens: 8192
  #     supports_vision: false

  # ── CEREBRAS — very fast, but hard 8K context cap on the free tier ───────────
  # Free tier (verify in your dashboard, it moves): ~5 RPM / 30K TPM / 1M tok/day,
  # and free-tier models are currently gpt-oss-120b and GLM-4.7 — NOT qwen3-235b.
  - model_name: cerebras-fast
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      rpm: 4
      tpm: 25000
    model_info:
      max_input_tokens: 8192
      max_tokens: 4096
      supports_vision: false

  # ── NVIDIA NIM — Kimi K3 (Moonshot AI), 1M context ───────────────────────────
  # Model id verified live 2026-09-01 with a real completion (HTTP 200).
  # Neither Llama 4 Maverick nor Nemotron 70B are actually invokable for this
  # account (both 404 "Function not found"), despite appearing in /v1/models --
  # that endpoint's listing does not reflect what's genuinely deployable.
  # Kimi K3 is a reasoning model: short max_tokens budgets can be consumed
  # entirely by reasoning_content before any final answer, so keep max_tokens
  # generous. rpm/tpm below are the general NVIDIA NIM dev-tier defaults, not
  # verified specifically for this model -- tighten with scripts/preflight.sh
  # once real usage patterns are known.
  - model_name: nvidia-kimi
    litellm_params:
      model: openai/moonshotai/kimi-k3
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      rpm: 35
      tpm: 200000
    model_info:
      max_input_tokens: 1000000
      max_tokens: 8192
      supports_vision: false

  # ── CLOUDFLARE WORKERS AI — small daily neuron budget, keep rpm low ──────────
  # api_base MUST be a whole-value env lookup. LiteLLM expands "os.environ/NAME"
  # only when it is the entire value — it does NOT interpolate mid-string.
  - model_name: cloudflare-llama
    litellm_params:
      model: openai/@cf/meta/llama-4-scout-17b-16e-instruct
      api_base: os.environ/CLOUDFLARE_API_BASE
      api_key: os.environ/CLOUDFLARE_API_KEY
      rpm: 3
      tpm: 50000
    model_info:
      max_input_tokens: 128000
      max_tokens: 4096
      supports_vision: false

  # ── AION LABS — off-topic and inconsequential traffic only ──────────────────
  # 15 RPM / 20K tokens per DAY. That budget is a rounding error against coding
  # work, which is exactly why it is fenced off: it serves Hermes' side-task
  # slots (titles, MCP summaries, skills-hub lookups) and direct off-topic
  # questions, and appears in NO tier. See docs/ROUTING.md for why this is not
  # a fifth complexity tier.
  - model_name: offtopic
    litellm_params:
      model: openai/aion-labs/aion-3.0-mini
      api_base: https://api.aionlabs.ai/v1
      api_key: os.environ/AION_API_KEY
      rpm: 12
      tpm: 20000
    model_info:
      max_input_tokens: 131072
      max_tokens: 8192
      supports_vision: false

  # ── GEMINI — REASONING tier and long-context rescue ──────────────────────────
  # PRIVACY: free-tier prompts may be used to improve Google's products.
  # Model id verified live 2026-09-01: gemini-2.5-flash still appears in
  # /v1beta/models but 404s at generation time with "no longer available to
  # new users" -- that listing endpoint is stale, same pattern as NVIDIA's.
  # gemini-3.6-flash is Google's current recommended replacement.
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 10
      tpm: 100000
    model_info:
      max_input_tokens: 1048576
      max_tokens: 8192
      supports_vision: true

  # ── POLLINATIONS — DISABLED. See docs/ASSESSMENT.md §"One wrong premise". ────
  # Third-party relay of other vendors' models, not a first-party API.
  #
  # - model_name: pollinations-gpt5
  #   litellm_params:
  #     model: openai/gpt-5
  #     api_base: https://text.pollinations.ai/openai
  #     api_key: os.environ/POLLINATIONS_API_KEY
  #     rpm: 60
  #     tpm: 500000
  #   model_info:
  #     max_input_tokens: 128000
  #     max_tokens: 8192

  # ── THE ROUTER — the only model name Hermes ever asks for ────────────────────
  - model_name: smart-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_default_model: mistral-tools
      complexity_router_config:
        # One model per tier, deliberately.
        # A list here is NOT an ordered preference list — LiteLLM picks from it
        # with random.choice(), which is exactly the provider-bouncing behaviour
        # this stack is trying to avoid. Ordered failover is the `fallbacks`
        # block in router_settings below.
        tiers:
          SIMPLE:    local-coder    # LOCAL-TIER-LINE free and unmetered; costs electricity
          MEDIUM:    mistral-tools        # mistral-small-latest, tool-capable, same account as codestral
          COMPLEX:   nvidia-kimi        # Kimi K3, 1M context, for multi-file work
          REASONING: gemini-flash         # low-volume tier; free-tier prompts may train Google's models

        default_model: mistral-tools

        # Deterministic overrides that run before the classifier. On the default
        # tier_boundaries the heuristic scorer sends most real coding prompts to
        # SIMPLE or MEDIUM, so these rules are doing much of the routing, not
        # merely refining it. Check any edit with scripts/explain-routing.py.
        keyword_tier_rules:
          - keywords: ["refactor", "architecture", "design pattern", "system design", "trade-off", "migrate", "scalab"]
            tier: REASONING
          - keywords: ["fix", "bug", "error", "stack trace", "exception", "traceback", "failing test", "regression"]
            tier: COMPLEX
          - keywords: ["rename", "format", "lint", "typo", "comment", "docstring", "import"]
            tier: SIMPLE

        # Keep a conversation on one model: preserves prompt cache, avoids
        # mid-session capability cliffs.
        session_affinity: true
        session_affinity_ttl_seconds: 1800

        # Bandit-style re-selection off: with free tiers you want predictable
        # placement, not exploration that quietly spends another provider's quota.
        adaptive: false

router_settings:
  # THE important one. Without this, max_input_tokens is inert and a long prompt
  # routed to an 8K deployment fails at the provider instead of being re-routed.
  enable_pre_call_checks: true

  num_retries: 1
  timeout: 60
  cooldown_time: 300
  allowed_fails: 2

  # Ordered failover on 429/5xx. Roughly: local first, then the generous
  # first-party tiers, then the metered ones, then the aggregator.
  # openrouter-free sits last because its lineup rotates and its per-model data
  # policies vary; gemini-flash sits just above it as the long-context rescue.
  # Tool-capable deployments (mistral-tools, nvidia-kimi, gemini-flash) are
  # preferred throughout -- codestral works for plain text but silently can't
  # call a tool if a fallback lands there, so it sits later in each chain
  # rather than being removed outright; it's still useful as a last resort
  # before the aggregator.
  fallbacks:
    - smart-router:        ["mistral-tools", "nvidia-kimi", "gemini-flash", "cloudflare-llama", "codestral", "openrouter-free"]
    - local-coder:         ["groq-fast", "cerebras-fast", "mistral-tools", "nvidia-kimi", "openrouter-free"]
    - groq-fast:           ["cerebras-fast", "mistral-tools", "nvidia-kimi", "openrouter-free"]
    - mistral-tools:       ["nvidia-kimi", "cloudflare-llama", "codestral", "openrouter-free"]
    - codestral:           ["nvidia-kimi", "cloudflare-llama", "openrouter-free"]
    - cerebras-fast:       ["nvidia-kimi", "openrouter-free"]
    - nvidia-kimi:         ["mistral-tools", "cloudflare-llama", "openrouter-free"]
    - offtopic:            ["cloudflare-llama", "openrouter-free"]

  # Separate chain for "prompt too long for that deployment". This is what
  # rescues an overflowing request mid-flight instead of failing it: the 8K
  # Cerebras cap, the 6K Groq TPM fence, and the 28K local window all land here.
  context_window_fallbacks:
    # smart-router is the group every client actually calls -- without an
    # entry keyed on it, a context-window failure inside the router (e.g.
    # the local tier's 28K cap) has nowhere to look up an escalation chain
    # and fails outright instead of rerouting. Verified live 2026-09-01.
    - smart-router:       ["mistral-tools", "nvidia-kimi", "gemini-flash"]
    - local-coder:        ["mistral-tools", "nvidia-kimi", "gemini-flash"]
    - groq-fast:          ["mistral-tools", "nvidia-kimi", "gemini-flash"]
    - cerebras-fast:      ["nvidia-kimi", "gemini-flash"]
    - mistral-tools:      ["nvidia-kimi", "gemini-flash"]
    - codestral:          ["nvidia-kimi", "gemini-flash"]
    - nvidia-kimi:    ["gemini-flash"]
    - offtopic:           ["gemini-flash"]

litellm_settings:
  # No drop_params here. It was set globally as a broad safety net against
  # minor provider param mismatches, without ever hitting a real failure
  # that needed it -- and it was confirmed live 2026-09-01 to be silently
  # stripping `tools` from every request before it reached any provider,
  # which is why Hermes could describe tool calls as text but never
  # actually execute one. If a specific deployment genuinely can't handle
  # a specific param, set drop_params on that one deployment's
  # litellm_params instead of globally.
  set_verbose: false
  request_timeout: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
